<!doctype html>
<html lang="ja">
  <head>
    <title>ページが見つかりません（404）</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon.png">
    <style>
      /* 静的なページなので、アプリの CSS（Tailwind）は読み込めない。色と大きさは Tailwind の値を写した。アプリの色を変えたら、ここと 500.html も直す */
      :root {
        color-scheme: dark;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: oklch(14.5% 0 0); /* neutral-950 */
        color: oklch(97% 0 0); /* neutral-100 */
        font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        line-height: 1.5;
      }

      .page {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        max-width: 28rem; /* max-w-md */
        margin: 0 auto;
        background: oklch(20.5% 0 0); /* neutral-900 */
      }

      header {
        border-bottom: 1px solid oklch(37.1% 0 0); /* neutral-700 */
        background: oklch(14.5% 0 0); /* neutral-950 */
        padding: 0.75rem 1rem;
      }

      header a {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: inherit;
        font-size: 1.125rem; /* text-lg */
        font-weight: 700;
        text-decoration: none;
      }

      main {
        display: flex;
        flex-grow: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 2rem 1rem;
        text-align: center;
      }

      .status {
        color: oklch(55.6% 0 0); /* neutral-500 */
        font-size: 2.25rem; /* text-4xl */
        font-weight: 700;
      }

      h1 {
        font-size: 1.125rem; /* text-lg */
        font-weight: 700;
      }

      p {
        color: oklch(70.8% 0 0); /* neutral-400 */
        font-size: 0.875rem; /* text-sm */
      }

      .button {
        margin-top: 1rem;
        border: 1px solid oklch(43.9% 0 0); /* neutral-600 */
        border-radius: 0.375rem;
        padding: 0.5rem 1rem;
        color: inherit;
        font-size: 0.875rem; /* text-sm */
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="page">
      <header>
        <a href="/">レシパシャ</a>
      </header>
      <main>
        <div class="status">404</div>
        <h1>ページが見つかりません</h1>
        <p>URLが間違っているか、<br>ページが削除された可能性があります。</p>
        <a class="button" href="/">トップへ戻る</a>
      </main>
    </div>
  </body>
</html>
